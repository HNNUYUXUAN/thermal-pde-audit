[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-pde-audit"
version = "0.1.0"
description = "Physics-validated 1D heat simulation with CPU and Biren GPU quantum backends"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "thermal-pde-audit contributors"}]
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.5",
  "scipy>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = [
  "mypy>=1.10",
  "pytest>=7",
  "ruff>=0.6",
]

[project.scripts]
thermal-pde-audit = "thermal_pde_audit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thermal_pde_audit = ["validated_profiles.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gpu: requires the remote Biren GPU/SUPA competition environment",
]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
